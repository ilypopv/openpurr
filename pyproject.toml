[project]
name = "openpr"
version = "0.1.0"
description = "CLI tool to generate PR titles, descriptions, and post-review change summaries using a local LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
opo = "openpr.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpr"]
