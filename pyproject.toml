[project]
name = "openpurr"
version = "0.8.6"
description = "CLI tool to generate PR titles, descriptions, and post-review change summaries using a local or cloud LLM."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "Ilya Popov", email = "ilypopv@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "anthropic>=0.122.0",
    "questionary>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ilypopv/openpurr"
Repository = "https://github.com/ilypopv/openpurr"

[project.scripts]
opo = "openpurr.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpurr"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
